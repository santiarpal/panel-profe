<style>
/* Layout: capçalera amb cercador, una fila de classes destacades i seccions de recursos en graella de targetes compactes */
:root {
  --bg: #F1F4F8;
  --surface: #FFFFFF;
  --fg: #0F1A2B;
  --muted: #566277;
  --line: #DAE0EA;
  --accent: #2B55D9;
  --k-sheet: #12814A;
  --k-doc: #2B55D9;
  --k-folder: #A86A0B;
  --k-web: #6A4BCB;
  --k-app: #0B7A86;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C131E; --surface: #131D2B; --fg: #E8EDF5; --muted: #98A4B8; --line: #25324A;
    --accent: #7B9BFF; --k-sheet: #4CC98A; --k-doc: #7B9BFF; --k-folder: #E3A94F; --k-web: #A692F2; --k-app: #4CC3CF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C131E; --surface: #131D2B; --fg: #E8EDF5; --muted: #98A4B8; --line: #25324A;
  --accent: #7B9BFF; --k-sheet: #4CC98A; --k-doc: #7B9BFF; --k-folder: #E3A94F; --k-web: #A692F2; --k-app: #4CC3CF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 14px 16px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.id { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; }
.who { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; }
.sep { width: 32px; height: 1px; background: var(--accent); }
.subj { font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.titlerow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.hbtn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); font: 600 14px var(--font-body); cursor: pointer; transition: transform .15s ease; }
.hbtn:hover { transform: translateY(-1px); }
.hbtn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.hbtn svg { width: 18px; height: 18px; }
.ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--fg) 62%, transparent); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; min-height: 0; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 12px 18px; border-bottom: 1px solid var(--line); }
.phead strong { font-family: var(--font-display); font-size: 18px; }
.close { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 600 14px var(--font-body); cursor: pointer; }
.close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pbody { overflow: auto; padding: 12px; min-height: 0; }
.pbody img { display: block; width: 100%; min-width: 640px; max-width: 1055px; height: auto; margin: 0 auto; border-radius: 6px; }
h1 { font-family: var(--font-display); font-size: clamp(34px, 6vw, 52px); line-height: 1.02; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.date { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: inherit; font-size: 16px; padding: 0 56px 0 44px;
}
.search input::placeholder { color: var(--muted); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search kbd {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 600 12px var(--font-body); color: var(--muted);
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px;
}
section { display: flex; flex-direction: column; gap: 12px; }
h2 { font-family: var(--font-display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; display: flex; align-items: center; gap: 12px; }
h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.classes { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
a.card {
  display: flex; align-items: center; gap: 12px; min-width: 0; padding: 14px; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
a.card:hover { transform: translateY(-2px); border-color: var(--k); box-shadow: 0 8px 20px -12px var(--k); }
a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico {
  flex: none; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; color: var(--k);
  background: color-mix(in srgb, var(--k) 14%, transparent);
}
.ico svg { width: 22px; height: 22px; }
.txt { min-width: 0; display: flex; flex-direction: column; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.kind { font-size: 12.5px; color: var(--muted); }
.classes a.card { flex-direction: column; align-items: flex-start; gap: 14px; padding: 16px; }
.classes .name { font-family: var(--font-display); font-size: 24px; letter-spacing: -.01em; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { a.card { transition: none; } a.card:hover { transform: none; } }
</style>

<script>
const ov = document.getElementById("ov");
function openH() { ov.hidden = false; document.getElementById("hclose").focus(); }
function closeH() { ov.hidden = true; document.getElementById("hbtn").focus(); }
document.getElementById("hbtn").addEventListener("click", openH);
document.getElementById("hclose").addEventListener("click", closeH);
ov.addEventListener("click", e => { if (e.target === ov) closeH(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !ov.hidden) closeH(); });
/* Per afegir o canviar un enllaç, edita només aquesta llista.
   kind pot ser: sheet (full de càlcul), doc (document), folder (carpeta), web (pàgina web), app (plataforma). */

    { name: "Tutoria 4t", kind: "sheet", url: "https://docs.google.com/spreadsheets/d/1iumeQOs43PuJ9iPEYdQIQ4ryxLVM0IfVUH3nAn9162s/edit?gid=0#gid=0" },
    { name: "2n BAT", kind: "sheet", url: "https://docs.google.com/spreadsheets/d/1lWHvSF7q9IaJnk_J-vIaX7HRzfPD7elahjgBuI437nM/edit?gid=238793303#gid=238793303" }
  ]},
  { title: "Sites, llibres i Classrooms", items: [
    { name: "Sites alumnes", kind: "web", url: "https://sites.google.com/d/1GvFyB0Foc6w7eD0Yaz4QKNrf7798xJSr/p/1dha-CytIvDMvCCGENn-rqSmV3AbuVfL0/edit" },

  ]},
  { title: "Gestió", items: [

    { name: "Pla de treball per cursos", kind: "sheet", url: "https://docs.google.com/spreadsheets/d/1L8hOmb90_VdTTWh7VuuKmyx1Y9MZ62e1XKPR0Zoosfw/edit?gid=886082696#gid=886082696" },

const KINDS = {
  sheet:  { label: "Full de càlcul", icon: "i-sheet",  color: "var(--k-sheet)" },
  doc:    { label: "Document",       icon: "i-doc",    color: "var(--k-doc)" },
  folder: { label: "Carpeta de Drive", icon: "i-folder", color: "var(--k-folder)" },
  web:    { label: "Pàgina web",     icon: "i-web",    color: "var(--k-web)" },
  app:    { label: "Plataforma",     icon: "i-app",    color: "var(--k-app)" }
};
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const main = document.getElementById("main");

function render() {
  let html = "", total = 0;
  for (const sec of SECTIONS) {
    const items = sec.items;
    if (!items.length) continue;
    total += items.length;
    html += `<section><h2>${sec.title}</h2><div class="grid ${sec.layout || ""}">` + items.map(i => {
      const k = KINDS[i.kind];
      return `<a class="card" style="--k:${k.color}" href="${i.url}" target="_blank" rel="noopener noreferrer">
        <span class="ico"><svg><use href="#${k.icon}"/></svg></span>
        <span class="txt"><span class="name">${i.name}</span><span class="kind">${k.label}</span></span></a>`;
    }).join("") + `</div></section>`;
  }
  main.innerHTML = html;
}
try {
  document.getElementById("date").textContent = new Date().toLocaleDateString("ca-ES", { weekday: "long", day: "numeric", month: "long" });
} catch (e) {}
render();
</script>
